<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vault</title>
<main>
  <h1>Vault</h1>
  <form id="login">
    <h2>Sign in</h2>
    <label>Username <input name="username" required autocomplete="username"></label>
    <label>Password <input name="password" type="password" required autocomplete="current-password"></label>
    <button>Continue</button>
  </form>
  <section id="enrollment" hidden>
    <h2>Set up authenticator</h2>
    <p>Scan this QR code in your authenticator app, then enter its six-digit code.</p>
    <img id="qr" alt="Authenticator setup QR code">
    <p>Manual key: <code id="secret"></code></p>
  </section>
  <form id="verify" hidden>
    <h2>Verify code</h2>
    <label>Authenticator code <input name="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required autocomplete="one-time-code"></label>
    <button>Verify</button>
  </form>
  <section id="documents" hidden>
    <h2>Documents</h2>
    <button id="signout">Sign out</button>
    <ul id="list"></ul>
    <pre id="content"></pre>
  </section>
  <p id="message" role="status"></p>
</main>
<script type="module" src="/app.js"></script>
</html>
