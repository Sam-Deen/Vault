spring:
  application:
    name: vault
  jackson:
    deserialization:
      fail-on-numbers-for-enums: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/vault}
    username: ${DB_USERNAME:vault}
    password: ${DB_PASSWORD:vault-local-demo}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
