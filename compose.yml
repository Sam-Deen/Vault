name: vault
services:
  app:
    build: .
    environment:
      HTTPS_PORT: ${HTTPS_PORT:-8443}
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
      - "127.0.0.1:${HTTPS_PORT:-8443}:${HTTPS_PORT:-8443}"
    volumes:
      - vault-data:/app/data
      - ./certs:/app/certs:ro
    healthcheck:
      test: ["CMD", "node", "-e", "require('node:https').get({hostname:'127.0.0.1',port:process.env.HTTPS_PORT,path:'/api/health',ca:require('node:fs').readFileSync('certs/localhost.pem')},r=>{r.resume();process.exit(r.statusCode===200?0:1)}).on('error',()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  vault-data:
