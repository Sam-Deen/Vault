name: vault
services:
  db:
    build:
      context: .
      dockerfile: db/Dockerfile
    environment:
      POSTGRES_DB: vault
      POSTGRES_USER: vault_admin
      POSTGRES_PASSWORD: vault-admin-demo
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - vault-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vault_admin -d vault"]
      interval: 2s
      timeout: 3s
      retries: 20
  app:
    build: .
    environment:
      HTTPS_PORT: ${HTTPS_PORT:-8443}
      DOCUMENT_MASTER_KEY: ${DOCUMENT_MASTER_KEY:?Run npm run keygen first}
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
      - "127.0.0.1:${HTTPS_PORT:-8443}:${HTTPS_PORT:-8443}"
    volumes:
      - vault-data:/app/data
      - ./certs:/app/certs:ro
    healthcheck:
      test: ["CMD", "node", "-e", "require('node:https').get({hostname:'127.0.0.1',port:process.env.HTTPS_PORT,path:'/api/health',ca:require('node:fs').readFileSync('certs/localhost.pem')},r=>{r.resume();process.exit(r.statusCode===200?0:1)}).on('error',()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  vault-postgres-data:
  vault-data:
